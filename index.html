<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Officina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebed;--card:#fff;--tx:#17252d;--mu:#5d6b73;--ac:#1f5fbf;--on:#fff;--bd:#d3d9dd;--s1:#7b8791;--s2:#c98a00;--s3:#1c8a4a;--s4:#aab3b9}
@media(prefers-color-scheme:dark){:root{--bg:#12191d;--card:#1b252b;--tx:#e8eef1;--mu:#93a1aa;--ac:#6ea3f2;--on:#0c1418;--bd:#2c3a42;--s1:#93a1aa;--s2:#e0a526;--s3:#4cc47e;--s4:#5d6b73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
h1,h2{font-family:'Barlow Condensed',Barlow,sans-serif;margin:0 0 8px}
h1{font-size:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
header h1{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;border-radius:8px;padding:10px 16px;background:var(--ac);color:var(--on);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.danger{background:transparent;color:#c0392b;border:1px solid currentColor}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button,.chips button{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:7px 14px;white-space:nowrap;border-radius:99px}
.tabs button.on,.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
label{display:block;margin-bottom:10px;font-size:14px;color:var(--mu)}
label>*{margin-top:4px;color:var(--tx)}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:6px solid var(--c,var(--s1))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plate{font:700 21px 'Barlow Condensed',sans-serif;letter-spacing:.06em;background:#fff;color:#111;border:2px solid #111;border-radius:5px;padding:0 9px 0 28px;position:relative;white-space:nowrap}
.plate:before{content:'I';position:absolute;left:0;top:0;bottom:0;width:19px;background:#1d4fa8;color:#fff;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:1px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
select.st{width:auto;padding:6px 8px;font-size:14px}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 10px #0004}
dialog{border:0;border-radius:12px;padding:18px;width:min(460px,94vw);max-height:92vh;background:var(--bg);color:var(--tx)}
dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
.empty{text-align:center;color:var(--mu);padding:40px 0}
a{color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>n==null?'':Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const oggi=()=>new Date().toISOString().slice(0,10);
const STATI=[['da_fare','Da fare'],['in_corso','In corso'],['pronto','Pronto'],['consegnato','Consegnato']];
const COL={da_fare:'--s1',in_corso:'--s2',pronto:'--s3',consegnato:'--s4'};
const FILT=[['attivi','Attivi'],['da_fare','Da fare'],['in_corso','In corso'],['pronto','Pronti'],['consegnato','Consegnati'],['tutti','Tutti']];
let db,tab='lavori',filtro='attivi',q='',clienti=[],lavori=[];

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}

async function init(){
  let c=null;try{c=JSON.parse(localStorage.getItem('cfg'))}catch{}
  if(!c)return setup();
  db=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
  db.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')login()});
  const{data}=await db.auth.getSession();
  data.session?load():login();
}

function setup(){
  $('#app').innerHTML=`<h1>Collega il database</h1><p class="mu">Incolla l’indirizzo del progetto Supabase e la chiave pubblica (anon o publishable). Mai la chiave service_role.</p><form id="f"><label>Indirizzo del progetto<input name="url" type="url" placeholder="https://xxxx.supabase.co" required></label><label>Chiave pubblica<input name="key" required></label><button>Salva e continua</button></form>`;
  $('#f').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));localStorage.setItem('cfg',JSON.stringify({url:o.url.trim(),key:o.key.trim()}));init()};
}

function login(){
  $('#app').innerHTML=`<h1>Officina</h1><p class="mu">Accedi con l’utente creato in Supabase.</p><form id="f"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="row" style="justify-content:flex-start"><button>Accedi</button><button type="button" class="ghost" id="rc">Cambia database</button></div></form>`;
  $('#rc').onclick=()=>{localStorage.removeItem('cfg');setup()};
  $('#f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const{error}=await db.auth.signInWithPassword(o);error?toast('Accesso non riuscito: '+error.message):load()};
}

async function load(){
  const[a,b]=await Promise.all([db.from('clienti').select('*').order('nome'),db.from('lavori').select('*').order('created_at',{ascending:false})]);
  const err=a.error||b.error;
  if(err){
    if(err.code==='PGRST301'||err.status===401||/jwt/i.test(err.message))return login();
    return toast('Errore: '+err.message);
  }
  clienti=a.data;lavori=b.data;shell();
}

function shell(){
  $('#app').innerHTML=`<header><h1>Officina</h1><button class="ghost" id="out">Esci</button></header><div class="tabs"><button data-t="lavori">Lavori</button><button data-t="clienti">Clienti</button></div><div id="bar"></div><div id="list"></div><button class="fab" id="add" aria-label="Aggiungi">+</button>`;
  $('#out').onclick=async()=>{await db.auth.signOut();login()};
  $('#add').onclick=()=>tab==='lavori'?formLavoro({}):formCliente({});
  document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===tab);b.onclick=()=>{tab=b.dataset.t;q='';shell()}});
  $('#list').onchange=async e=>{
    const id=e.target.dataset.id;if(!id)return;
    const stato=e.target.value,data_consegna=stato==='consegnato'?oggi():null;
    const{error}=await db.from('lavori').update({stato,data_consegna}).eq('id',id);
    if(error)return toast(error.message);
    Object.assign(lavori.find(l=>l.id===id),{stato,data_consegna});draw();
  };
  $('#list').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.e)formLavoro(lavori.find(l=>l.id===b.dataset.e));
    if(b.dataset.c)formCliente(clienti.find(c=>c.id===b.dataset.c));
  };
  bar();draw();
}

function bar(){
  $('#bar').innerHTML=(tab==='lavori'?`<div class="chips">${FILT.map(([k,l])=>`<button data-f="${k}" class="${k===filtro?'on':''}">${l}</button>`).join('')}</div>`:'')+`<label><input id="q" type="search" placeholder="Cerca" value="${esc(q)}"></label>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;bar();draw()});
  $('#q').oninput=e=>{q=e.target.value;draw()};
}

function draw(){
  const s=q.trim().toLowerCase(),cl=id=>clienti.find(c=>c.id===id);
  let h='';
  if(tab==='lavori'){
    const r=lavori.filter(l=>(filtro==='tutti'||(filtro==='attivi'?l.stato!=='consegnato':l.stato===filtro))&&(!s||[l.targa,l.veicolo,l.descrizione,cl(l.cliente_id)?.nome].join(' ').toLowerCase().includes(s)));
    h=r.map(l=>{const c=cl(l.cliente_id);return `<div class="card" style="--c:var(${COL[l.stato]})"><div class="top"><span class="plate">${esc(l.targa||'—')}</span><strong>${eur(l.importo)}</strong></div><div style="margin:6px 0 2px"><strong>${esc(l.veicolo)}</strong>${c?' · '+esc(c.nome):''}</div><div>${esc(l.descrizione)}</div><div class="mu">Ingresso ${l.data_ingresso?l.data_ingresso.split('-').reverse().join('/'):'—'}</div><div class="top" style="margin-top:8px"><select class="st" data-id="${l.id}" aria-label="Stato">${STATI.map(([k,n])=>`<option value="${k}"${k===l.stato?' selected':''}>${n}</option>`).join('')}</select><button class="ghost" data-e="${l.id}">Modifica</button></div></div>`}).join('');
  }else{
    h=clienti.filter(c=>!s||[c.nome,c.telefono].join(' ').toLowerCase().includes(s)).map(c=>`<div class="card"><div class="top"><strong>${esc(c.nome)}</strong><button class="ghost" data-c="${c.id}">Modifica</button></div>${c.telefono?`<a href="tel:${esc(c.telefono)}">${esc(c.telefono)}</a>`:''}<div class="mu">${esc(c.note)}</div></div>`).join('');
  }
  $('#list').innerHTML=h||`<div class="empty">Niente da mostrare. Tocca + per aggiungere.</div>`;
}

function modal(title,fields,v,save,del){
  const d=$('#dlg'),req=['nome','descrizione'];
  d.innerHTML=`<form id="m"><h2>${title}</h2>${fields.map(([k,l,t,o])=>`<label>${l}${
    t==='select'?`<select name="${k}">${o.map(([a,b])=>`<option value="${a}"${a===(v[k]??'')?' selected':''}>${esc(b)}</option>`).join('')}</select>`
    :t==='area'?`<textarea name="${k}" rows="3"${req.includes(k)?' required':''}>${esc(v[k])}</textarea>`
    :`<input name="${k}" type="${t||'text'}"${t==='number'?' step="any"':''} value="${esc(v[k])}"${req.includes(k)?' required':''}>`}</label>`).join('')}<div class="row"><button type="button" class="ghost" id="no">Annulla</button>${del?'<button type="button" class="danger" id="del">Elimina</button>':''}<button>Salva</button></div></form>`;
  $('#no').onclick=()=>d.close();
  if(del)$('#del').onclick=async()=>{if(!confirm('Eliminare in modo definitivo?'))return;const{error}=await del();if(error)return toast(error.message);d.close();load()};
  $('#m').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));for(const k in o)if(o[k]==='')o[k]=null;const{error}=await save(o);if(error)return toast(error.message);d.close();load()};
  d.showModal();
}

function formLavoro(v){
  const nuovo=!v.id;if(nuovo)v={stato:'da_fare',data_ingresso:oggi()};
  modal(nuovo?'Nuovo lavoro':'Modifica lavoro',[
    ['targa','Targa'],['veicolo','Veicolo (marca e modello)'],
    ['cliente_id','Cliente','select',[['','Nessuno'],...clienti.map(c=>[c.id,c.nome])]],
    ['descrizione','Lavoro da fare','area'],['stato','Stato','select',STATI],
    ['importo','Importo (€)','number'],['data_ingresso','Data ingresso','date'],['note','Note','area']],v,
    o=>{if(o.targa)o.targa=o.targa.trim().toUpperCase();o.data_consegna=o.stato==='consegnato'?(v.data_consegna||oggi()):null;return nuovo?db.from('lavori').insert(o):db.from('lavori').update(o).eq('id',v.id)},
    nuovo?null:()=>db.from('lavori').delete().eq('id',v.id));
}

function formCliente(v){
  const nuovo=!v.id;
  modal(nuovo?'Nuovo cliente':'Modifica cliente',[['nome','Nome'],['telefono','Telefono','tel'],['note','Note','area']],v,
    o=>nuovo?db.from('clienti').insert(o):db.from('clienti').update(o).eq('id',v.id),
    nuovo?null:()=>db.from('clienti').delete().eq('id',v.id));
}

init();
</script>
</body>
</html>
